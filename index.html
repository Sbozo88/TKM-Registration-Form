<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKMProject | Music & Cultural Excellence</title>
  <meta name="description"
    content="Join TKMProject in Johannesburg. Registration open for Violin, Cello, Dance, and more. Space is limited, first-come first-serve." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tkm-project.netlify.app/" />
  <meta property="og:title" content="TKMProject School" />
  <meta property="og:description"
    content="Cultivating excellence in music and culture. Register online today. Space is limited!" />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1507838153414-b4b713384ebd?q=80&w=1200&h=630&fit=crop" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
            accent: {
              500: '#d97706',
              600: '#b45309',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif'],
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            'premium': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
            'inner-glow': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.05)',
          },
          backdropBlur: {
            'xs': '2px',
          },
        },
      },
    }
  </script>
  <script>
    // Immediately apply dark mode to avoid FOUC (Flash of Unstyled Content)
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .bg-pattern {
      background-color: #ffffff;
      background-image: radial-gradient(#0ea5e9 0.5px, #ffffff 0.5px);
      background-size: 20px 20px;
    }

    .dark .bg-pattern {
      background-color: #020617;
      background-image: radial-gradient(#0ea5e9 0.5px, #020617 0.5px);
    }

    .glass-effect {
      @apply backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border border-white/20 dark:border-slate-800/20;
    }

    .premium-gradient {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
    }

    /* Selection Color */
    ::selection {
      background-color: rgba(14, 165, 233, 0.2);
      color: #0369a1;
    }

    .dark ::selection {
      background-color: rgba(56, 189, 248, 0.3);
      color: #e0f2fe;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      15%,
      45%,
      75% {
        transform: translateX(-4px);
      }

      30%,
      60%,
      90% {
        transform: translateX(4px);
      }
    }

    .animate-shake {
      animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes error-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
        border-color: #ef4444;
      }

      50% {
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
        border-color: #ef4444;
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        border-color: #ef4444;
      }
    }

    .animate-input-error {
      animation: error-pulse 0.5s ease-out;
    }

    @keyframes fade-in-up {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fade-in {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fade-in 0.6s ease-out both;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Smooth Transition for Theme Switch */
    * {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* Hidden Scrollbar */
    .hidden-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hidden-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "path": "https://esm.sh/path@^0.12.7"
  }
}
</script>
  <link rel="icon" type="image/png" href="/tkm-logo.png">
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
